<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Whiteboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">M</span><div><strong>My Whiteboard</strong><button id="titleBtn" class="title-btn"><span id="boardTitle">白板</span>⌄</button></div></div>
    <div class="toolbar" aria-label="白板工具">
      <button data-tool="select" class="active" title="选择 V">↖</button>
      <button data-tool="hand" title="抓手 H">✋</button><i></i>
      <button data-add="rectangle" title="矩形 R">□</button>
      <button data-add="ellipse" title="圆形 O">○</button>
      <button data-add="diamond" title="菱形 D">◇</button>
      <button data-add="note" title="便签 N">▧</button>
      <button data-add="text" title="文字 T">T</button>
      <button data-add="arrow" title="箭头 A">→</button><i></i>
      <button id="undoBtn" title="撤销 Ctrl+Z">↶</button>
      <button id="redoBtn" title="重做 Ctrl+Shift+Z">↷</button>
    </div>
    <div class="actions">
      <span id="presence" class="presence">本地</span>
      <span id="saveState">已保存</span>
      <button id="historyBtn" class="ghost">历史</button>
      <button id="cloudBtn" class="primary">云端</button>
    </div>
  </header>
  <main>
    <section class="stage-wrap" id="stageWrap">
      <div id="selectionActions" class="selection-actions" hidden>
        <button data-align="left">左对齐</button><button data-align="center">居中</button><button data-align="top">顶对齐</button>
        <button id="groupBtn">编组</button><button id="ungroupBtn">解组</button>
        <button data-layer="front">置顶</button><button data-layer="back">置底</button>
      </div>
      <svg id="stage" xmlns="http://www.w3.org/2000/svg" role="application" aria-label="可编辑白板">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
          <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".12"/></filter>
        </defs>
        <g id="viewport"><rect id="boardBg"/><g id="elements"></g><g id="selections"></g><rect id="marquee" visibility="hidden"/></g>
      </svg>
      <div class="zoom-controls"><button id="minusBtn">−</button><span id="zoomValue">100%</span><button id="plusBtn">＋</button><button id="fitBtn">适应</button></div>
      <div class="hint">Shift 多选 · 拖空白处框选 · Ctrl/Cmd+C/V 复制粘贴 · 空格拖动画布</div>
    </section>
    <aside class="inspector">
      <div class="panel-title"><strong>属性</strong><span id="selectionCount"></span></div>
      <div id="emptyInspector" class="empty"><div class="empty-icon">◇</div><strong>选择元素</strong><p>可以多选、对齐、编组和调整层级。</p></div>
      <form id="inspectorForm" hidden>
        <label>文字<textarea id="textInput" rows="3"></textarea></label>
        <div class="row"><label>填充<input id="fillInput" type="color"></label><label>描边<input id="strokeInput" type="color"></label></div>
        <div class="row"><label>X<input id="xInput" type="number"></label><label>Y<input id="yInput" type="number"></label></div>
        <div class="row"><label>宽<input id="widthInput" type="number" min="1"></label><label>高<input id="heightInput" type="number" min="1"></label></div>
        <label>字号<div class="range-row"><input id="fontSizeInput" type="range" min="10" max="64"><span id="fontSizeValue"></span></div></label>
        <div class="row"><button type="button" id="lockBtn" class="secondary">锁定</button><button type="button" id="duplicateBtn" class="secondary">复制</button></div>
        <button type="button" id="deleteBtn" class="danger">删除所选</button>
      </form>
      <section class="codex-card">
        <strong>让 Codex 修改所选</strong>
        <textarea id="codexPrompt" rows="3" placeholder="例如：把这些卡片改成紫色并平均分布"></textarea>
        <button id="askCodexBtn" class="secondary">复制修改请求</button>
        <small id="codexState">选区会作为结构化上下文提供给 Codex。</small>
      </section>
      <footer><strong id="storageMode">Local first</strong><p id="storageText">本地自动保存；登录后可同步、分享与协作。</p></footer>
    </aside>
  </main>

  <div id="drawer" class="drawer" hidden>
    <div class="drawer-head"><div><strong id="drawerTitle">云端</strong><p id="drawerSubtitle">登录、同步与协作</p></div><button id="drawerClose">×</button></div>
    <section id="authPanel">
      <label>邮箱<input id="emailInput" type="email" placeholder="you@example.com"></label>
      <label>密码<input id="passwordInput" type="password" placeholder="至少 6 位"></label>
      <div class="row"><button id="signInBtn" class="primary">登录</button><button id="signUpBtn" class="secondary">注册</button></div>
      <p class="muted">发布密钥只用于安全登录；高权限 Secret 不会保存在浏览器。</p>
    </section>
    <section id="cloudPanel" hidden>
      <div class="user-chip"><span id="userInitial">U</span><div><strong id="userEmail"></strong><small>已连接 Supabase</small></div></div>
      <button id="syncBtn" class="primary wide">立即同步</button>
      <button id="shareBtn" class="secondary wide">创建协作链接</button>
      <button id="signOutBtn" class="plain wide">退出登录</button>
      <div id="shareResult" class="share-result" hidden><label>分享链接<input id="shareUrl" readonly></label><button id="copyShareBtn">复制链接</button></div>
    </section>
    <section id="historyPanel" hidden><div id="historyList" class="history-list"></div></section>
    <p id="drawerMessage" class="drawer-message"></p>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
